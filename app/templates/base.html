<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VN-Edu LOD{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --ink: #1d2433; --muted: #5d6677; --line: #e3e1da;
    --accent: #0f6e64; --accent-soft: #e2f1ee; --warn: #9a5b00; --warn-soft: #fbf0dc;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --surface: #1c2029; --ink: #e6e8ec; --muted: #9aa3b2; --line: #2c313c;
            --accent: #4fc3b1; --accent-soft: #1d3632; --warn: #e3a74a; --warn-soft: #3a2f1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Be Vietnam Pro", system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { border-bottom: 1px solid var(--line); background: var(--surface); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 18px; flex-wrap: wrap; }
  nav a { color: var(--muted); font-weight: 500; }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.02em; }
  h2 { font-size: 18px; margin: 34px 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  .uri { font-family: var(--mono); font-size: 13px; color: var(--muted); word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  td.p { width: 30%; }
  td.p small { display: block; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px; }
  .pill.ext { background: var(--warn-soft); color: var(--warn); }
  .pill.inf { background: transparent; border: 1px dashed var(--accent); }
  .lang { color: var(--muted); font-size: 12px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .btn { display: inline-block; padding: 7px 14px; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; }
  .btn:hover { text-decoration: none; opacity: .9; }
  .table-wrap { overflow-x: auto; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 16px 40px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">VN-Edu <span>LOD</span></a>
  <nav>
    <a href="/query">Truy vấn SPARQL</a>
    <a href="/ontology">Ontology</a>
    <a href="/resource/university/dai-hoc-bach-khoa-ha-noi">Ví dụ tài nguyên</a>
    <a href="/dataset">VoID</a>
  </nav>
</div></header>
<main>{% block main %}{% endblock %}</main>
<footer>Dữ liệu liên kết mở về giáo dục đại học Việt Nam · nguồn: Wikidata (CC0), DBpedia, GeoNames · danh mục ngành theo TT 09/2022/TT-BGDĐT</footer>
</body>
</html>
