# Cách 2: chạy Fuseki bằng Docker (cần Docker Desktop đang chạy)
#   docker compose -f fuseki/docker-compose.yml up -d
#   $env:FUSEKI_USER='admin'; $env:FUSEKI_PASSWORD='...'; py scripts/step5_load_fuseki.py --url http://127.0.0.1:3030
services:
  fuseki:
    image: ${FUSEKI_IMAGE:?Set an operator-reviewed image@sha256 digest}
    container_name: vnedu-fuseki
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?Set a non-demo password}
      TDB: "2"
      FUSEKI_DATASET_1: vnedu
      JVM_ARGS: "-Xmx2g"
    volumes:
      - fuseki-data:/fuseki
volumes:
  fuseki-data:
