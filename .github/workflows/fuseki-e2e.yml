name: Fuseki TDB2 acceptance
on:
  push:
    branches: ["codex/independent-audit"]
    paths:
      - "audit/fuseki_e2e.py"
      - "scripts/step5_load_fuseki.py"
      - "ontology/**"
      - "data/gold/**"
      - ".github/workflows/fuseki-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuseki:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt
      - name: Download and verify official Fuseki
        shell: bash
        run: |
          mkdir -p tmp/runtimes
          curl --fail --location --retry 2 https://archive.apache.org/dist/jena/binaries/apache-jena-fuseki-6.2.0.zip -o tmp/runtimes/fuseki.zip
          echo '46e5d798faf80fe5f4b32318750071b9172315f9d86bb3aa3ba4d5e94abe2e21cd194eab349d491a203c934c6e59b370a671b338f2a413110e859dc628ffe934  tmp/runtimes/fuseki.zip' | sha512sum --check
          unzip -q tmp/runtimes/fuseki.zip -d tmp/runtimes
      - name: TDB2 load, query parity, restart and denied writes
        run: python audit/fuseki_e2e.py --jar tmp/runtimes/apache-jena-fuseki-6.2.0/fuseki-server.jar
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fuseki-e2e-evidence
          path: |
            data/reports/fuseki-e2e.json
            tmp/fuseki-e2e-*/*.log
