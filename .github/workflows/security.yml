name: Security analysis

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pip-audit bandit
      - name: Audit pinned Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Scan the public server implementation
        run: bandit -q -r app -x app/templates

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
