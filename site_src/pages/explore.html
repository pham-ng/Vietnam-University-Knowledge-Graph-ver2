<!-- title: Tra cứu cơ sở giáo dục đại học · VN-Edu LOD -->
<!-- desc: Tìm kiếm, lọc và xuất danh sách cơ sở giáo dục đại học Việt Nam kèm URI Linked Data. -->
<!--HEAD-->
<style>
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: var(--ink); }
  td small { color: var(--muted); display: block; }
  .codes b { font-family: var(--mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 4px; margin-right: 3px; }
  #q { flex: 1 1 260px; }
</style>
<!--/HEAD-->
<h1>Tra cứu</h1>
<p class="sub">Mỗi dòng là một tài nguyên có URI riêng — bấm tên để xem toàn bộ dữ liệu RDF (gồm giá trị suy luận và liên kết ra ngoài).</p>
<div class="filters">
  <input id="q" type="search" placeholder="Tìm không cần dấu: tên, tên tiếng Anh, viết tắt, mã tuyển sinh…" aria-label="Tìm kiếm">
  <select id="prov" aria-label="Tỉnh"><option value="">Mọi tỉnh/thành</option></select>
  <select id="kind" aria-label="Loại hình"><option value="">Mọi loại hình</option></select>
  <select id="own" aria-label="Sở hữu"><option value="">Công lập + tư thục</option><option value="public">Công lập</option><option value="private">Tư thục</option></select>
  <button class="btn ghost" id="csv" type="button">Xuất CSV</button>
</div>
<p class="lang" id="n"></p>
<div class="card table-wrap"><table id="t">
  <thead><tr><th class="sort" data-k="name">Tên</th><th class="sort" data-k="kindVi">Loại hình</th><th class="sort" data-k="prov">Tỉnh/thành</th>
    <th class="sort num" data-k="year">Thành lập</th><th>Sở hữu</th><th>Mã TS</th><th>Chủ quản / thành viên của</th></tr></thead>
  <tbody></tbody></table></div>
<script>
(async () => {
  const D = await (await fetch("{{ROOT}}data/app.json")).json();
  const rows = D.institutions;
  const $ = id => document.getElementById(id);
  [...new Set(rows.map(r => r.prov).filter(Boolean))].sort((a, b) => a.localeCompare(b, "vi"))
    .forEach(p => $("prov").insertAdjacentHTML("beforeend", `<option>${VN.esc(p)}</option>`));
  [...new Set(rows.map(r => r.kindVi))].sort((a, b) => a.localeCompare(b, "vi"))
    .forEach(k => $("kind").insertAdjacentHTML("beforeend", `<option>${VN.esc(k)}</option>`));
  const params = new URLSearchParams(location.search);
  $("q").value = params.get("q") || "";
  if (params.get("prov")) $("prov").value = params.get("prov");
  let sortK = "name", asc = true;
  const OWN = { public: "công lập", private: "tư thục" };
  function current() {
    const q = VN.norm($("q").value.trim()), p = $("prov").value, k = $("kind").value, o = $("own").value;
    return rows.filter(r => (!p || r.prov === p) && (!k || r.kindVi === k) && (!o || r.own === o) &&
      (!q || VN.norm([r.name, r.en, r.short.join(" "), r.codes.join(" "), r.prov, r.provOld].join(" ")).includes(q)))
      .sort((a, b) => {
        const x = a[sortK], y = b[sortK];
        const c = typeof x === "number" || typeof y === "number" ? (x || 9999) - (y || 9999) : (x || "").localeCompare(y || "", "vi");
        return asc ? c : -c;
      });
  }
  function draw() {
    const xs = current();
    $("n").textContent = `${VN.fmt(xs.length)} / ${VN.fmt(rows.length)} cơ sở`;
    $("t").tBodies[0].innerHTML = xs.map(r => `<tr>
      <td><a href="${r.href}">${VN.esc(r.name)}</a>${r.en ? `<small>${VN.esc(r.en)}</small>` : ""}</td>
      <td>${VN.esc(r.kindVi)}${r.military ? ' <span class="pill">quân đội</span>' : ""}${r.police ? ' <span class="pill">công an</span>' : ""}</td>
      <td>${VN.esc(r.prov || "—")}${r.provOld ? `<small>ghi ở ${VN.esc(r.provOld)}</small>` : ""}</td>
      <td class="num">${r.year || "—"}${r.end ? `<small>giải thể ${r.end}</small>` : ""}</td>
      <td>${OWN[r.own] || "—"}</td>
      <td class="codes">${r.codes.map(c => `<b>${c}</b>`).join("")}</td>
      <td>${VN.esc([...r.gov, ...r.member].join(", "))}</td></tr>`).join("");
    const u = new URL(location); u.searchParams.set("q", $("q").value); history.replaceState(null, "", u);
  }
  ["q", "prov", "kind", "own"].forEach(id => $(id).addEventListener("input", draw));
  document.querySelectorAll("th.sort").forEach(th => th.addEventListener("click", () => {
    asc = sortK === th.dataset.k ? !asc : true; sortK = th.dataset.k; draw();
  }));
  $("csv").addEventListener("click", () => {
    const head = ["uri", "ten", "ten_tieng_anh", "loai_hinh", "tinh", "nam_thanh_lap", "so_huu", "ma_tuyen_sinh", "chu_quan", "thanh_vien_cua", "lat", "lon"];
    const q = v => `"${(v ?? "").toString().replace(/"/g, '""')}"`;
    const csv = [head.join(","), ...current().map(r => [r.uri, r.name, r.en, r.kindVi, r.prov, r.year, r.own, r.codes.join(" "),
      r.gov.join("; "), r.member.join("; "), r.lat, r.lon].map(q).join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = "vnedu-co-so.csv"; a.click();
  });
  draw();
})();
</script>
