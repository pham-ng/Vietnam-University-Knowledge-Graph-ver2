# CI: chạy toàn bộ test, build site tĩnh từ dữ liệu gold rồi đăng lên GitHub Pages.
# Site (site/) KHÔNG được commit — nó luôn được build lại từ mã nguồn + dữ liệu trong repo.
# Bật một lần: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (pipeline + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build giao diện cho máy chủ (đường dẫn gốc /) — để test máy chủ phục vụ đúng giao diện
        run: VNEDU_SITE_DIR=site_server VNEDU_SITE_ROOT=/ python scripts/step7_publish.py
      - name: Kiểm thử (suy luận, trích xuất, hợp đồng dữ liệu, infobox, máy chủ web)
        run: python -m pytest tests -q

  deploy:
    name: Build site & deploy Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site tĩnh (2.241 URI → HTML + Turtle + JSON-LD)
        run: python scripts/step7_publish.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
