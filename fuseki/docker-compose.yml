# Cách 2: chạy Fuseki bằng Docker (cần Docker Desktop đang chạy)
#   docker compose -f fuseki/docker-compose.yml up -d
#   py scripts/step5_load_fuseki.py --user admin --password vnedu-admin
services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: vnedu-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: vnedu-admin
      TDB: "2"
      FUSEKI_DATASET_1: vnedu
      JVM_ARGS: "-Xmx2g"
    volumes:
      - fuseki-data:/fuseki
volumes:
  fuseki-data:
